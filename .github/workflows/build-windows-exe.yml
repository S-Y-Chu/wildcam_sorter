name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.10,<7" "pillow>=10,<13" "opencv-python>=4.10,<5" "numpy>=2,<3" "av>=13,<17"

      - name: Run automated tests
        run: python -m unittest -v

      - name: Build single-file application
        run: pyinstaller --noconfirm --clean WildCamSorter.spec

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/WildCamSorter.exe")) {
            throw "dist/WildCamSorter.exe was not created"
          }
          Get-Item "dist/WildCamSorter.exe" | Format-List Name, Length, LastWriteTime
          (Get-FileHash "dist/WildCamSorter.exe" -Algorithm SHA256).Hash | Set-Content "dist/WildCamSorter.exe.sha256"

      - name: Create portable ZIP with README
        shell: pwsh
        run: |
          $package = "WildCamSorter_Windows_v1.10"
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item "dist/WildCamSorter.exe" "$package/WildCamSorter.exe"
          Copy-Item "README.md" "$package/README.md"
          Compress-Archive -Path $package -DestinationPath "$package.zip"
          (Get-FileHash "$package.zip" -Algorithm SHA256).Hash | Set-Content "$package.zip.sha256"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: WildCamSorter-Windows-v1.10
          path: |
            WildCamSorter_Windows_v1.10.zip
            WildCamSorter_Windows_v1.10.zip.sha256
          if-no-files-found: error
          retention-days: 30
