name: Release WildCam Sorter v1.10 macOS Hotfix

on:
  push:
    branches:
      - '1.10'
    paths:
      - 'wildcam_sorter.py'
      - 'requirements.txt'
      - 'test_wildcam_sorter.py'
      - 'WildCamSorter.spec'
      - 'WildCamSorter-macOS.spec'
      - 'macOS使用说明.txt'
      - 'README.md'
      - '.github/workflows/release-v1.10.yml'

permissions:
  contents: write

jobs:
  macos:
    name: macOS ${{ matrix.package_arch }} Portable
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            machine_arch: arm64
            package_arch: AppleSilicon
          - runner: macos-15-intel
            machine_arch: x86_64
            package_arch: Intel

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Verify native runner and Tk
        env:
          EXPECTED_ARCH: ${{ matrix.machine_arch }}
        run: |
          python - <<'PY'
          import os
          import platform
          import tkinter

          actual = platform.machine()
          expected = os.environ['EXPECTED_ARCH']
          print(f'Python architecture: {actual}')
          print(f'Tk version: {tkinter.TkVersion}')
          if actual != expected:
              raise SystemExit(f'Expected {expected}, got {actual}')
          PY

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.10,<7" "pillow>=10,<13" "opencv-python>=4.10,<5" "numpy>=2,<3" "av>=13,<17"

      - name: Run automated tests
        run: python -m unittest -v

      - name: Build native application bundle
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: pyinstaller --noconfirm --clean WildCamSorter-macOS.spec

      - name: Verify application architecture and signature
        env:
          EXPECTED_ARCH: ${{ matrix.machine_arch }}
        run: |
          test -d dist/WildCamSorter.app
          APP_BINARY="dist/WildCamSorter.app/Contents/MacOS/WildCamSorter"
          file "$APP_BINARY"
          file "$APP_BINARY" | grep -q "$EXPECTED_ARCH"
          codesign --verify --deep --strict --verbose=2 dist/WildCamSorter.app

      - name: Create macOS Portable ZIP
        env:
          PACKAGE_ARCH: ${{ matrix.package_arch }}
        run: |
          PACKAGE_NAME="WildCamSorter_macOS_${PACKAGE_ARCH}_v1.10_Portable"
          mkdir "$PACKAGE_NAME"
          ditto dist/WildCamSorter.app "$PACKAGE_NAME/WildCamSorter.app"
          cp macOS使用说明.txt "$PACKAGE_NAME/macOS使用说明.txt"
          cp README.md "$PACKAGE_NAME/README.md"
          ditto -c -k --sequesterRsrc --keepParent "$PACKAGE_NAME" "$PACKAGE_NAME.zip"
          shasum -a 256 "$PACKAGE_NAME.zip" > "$PACKAGE_NAME.zip.sha256"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.package_arch }}
          path: |
            WildCamSorter_macOS_${{ matrix.package_arch }}_v1.10_Portable.zip
            WildCamSorter_macOS_${{ matrix.package_arch }}_v1.10_Portable.zip.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - macos

    steps:
      - name: Check out release target
        uses: actions/checkout@v4

      - name: Download all native packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-macos-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -name '*.zip' | wc -l)" -eq 2
          (cd release-assets && sha256sum -c *.sha256)
          ls -lh release-assets

      - name: Publish v1.10 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## WildCam Sorter v1.10

          本版本重点改进详细查看器、大目录性能、快速连续分类、多范围拍摄模式、双进度条、主题与系统设置，并可自动识别输出目录中人工分好的文件、补写 CSV 记录。

          ### 下载选择

          - Windows 10/11 64 位：`WildCamSorter_Windows_v1.10_Portable.zip`
          - Apple M 系列芯片：`WildCamSorter_macOS_AppleSilicon_v1.10_Portable.zip`
          - Intel 芯片 Mac：`WildCamSorter_macOS_Intel_v1.10_Portable.zip`

          三个压缩包均包含 README；macOS 包另含详细安装说明。全部版本均无需安装 Python。
          EOF

          if gh release view v1.10 >/dev/null 2>&1; then
            gh release upload v1.10 release-assets/* --clobber
          else
            gh release create v1.10 release-assets/* \
              --target "$GITHUB_SHA" \
              --title "WildCam Sorter v1.10" \
              --notes-file release-notes.md \
              --latest
          fi
